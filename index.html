<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="description" content="A clean, fast calendar to track events, birthdays, and tasks." />
  <title>Kalendra — Plan your days</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%86%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- Sidebar / Header -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">📆</span>
        <span class="brand-name">Kalendra</span>
      </div>

      <div class="nav-controls">
        <button class="icon-btn" id="prevBtn" aria-label="Previous month" title="Previous month">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="today-btn" id="todayBtn">Today</button>
        <button class="icon-btn" id="nextBtn" aria-label="Next month" title="Next month">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 class="month-label" id="monthLabel">Month Year</h1>
      </div>

      <div class="topbar-actions">
        <div class="view-switch" role="tablist" aria-label="View switch">
          <button class="view-btn active" data-view="month" role="tab" aria-selected="true">Month</button>
          <button class="view-btn" data-view="agenda" role="tab" aria-selected="false">Agenda</button>
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
          <svg id="themeIconSun" viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="add-btn" id="addBtn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <span>Add</span>
        </button>
      </div>
    </header>

    <div class="body-layout">
      <!-- Main calendar area -->
      <main class="main-panel">
        <div class="weekday-row" id="weekdayRow"></div>
        <div class="month-grid" id="monthGrid"></div>

        <div class="agenda-view" id="agendaView" hidden>
          <div class="agenda-list" id="agendaList"></div>
        </div>
      </main>

      <!-- Right side panel -->
      <aside class="side-panel" id="sidePanel">
        <div class="panel-section">
          <div class="panel-header">
            <h2 id="selectedDayTitle">Today</h2>
          </div>
          <div class="day-items" id="dayItems">
            <p class="empty-hint">No items yet. Tap “Add” to create one.</p>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-header">
            <h2>Upcoming</h2>
          </div>
          <div class="upcoming-list" id="upcomingList"></div>
        </div>

        <div class="panel-section legend">
          <span class="legend-item"><i class="dot dot-event"></i>Event</span>
          <span class="legend-item"><i class="dot dot-birthday"></i>Birthday</span>
          <span class="legend-item"><i class="dot dot-task"></i>Task</span>
        </div>
      </aside>
    </div>

    <!-- Mobile bottom nav -->
    <nav class="mobile-tabs">
      <button class="mtab active" data-view="month">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Month
      </button>
      <button class="mtab" data-view="agenda">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Agenda
      </button>
      <button class="mtab" data-view="day">
        <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Today
      </button>
      <button class="mtab" id="mobileAddBtn">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 8v8M8 12h8" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round"/></svg>
        Add
      </button>
    </nav>
  </div>

  <!-- Day sheet for mobile (shows when a day is tapped) -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="day-sheet" id="daySheet">
    <div class="sheet-handle"></div>
    <div class="panel-header">
      <h2 id="sheetDayTitle">Today</h2>
      <button class="icon-btn" id="sheetCloseBtn" aria-label="Close">✕</button>
    </div>
    <div class="day-items" id="sheetDayItems"></div>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">New item</h2>
        <button class="icon-btn" id="modalCloseBtn" aria-label="Close">✕</button>
      </div>

      <form id="itemForm" class="modal-body">
        <input type="hidden" id="itemId" />

        <div class="type-tabs">
          <button type="button" class="type-tab active" data-type="event">🎯 Event</button>
          <button type="button" class="type-tab" data-type="birthday">🎂 Birthday</button>
          <button type="button" class="type-tab" data-type="task">✅ Task</button>
        </div>

        <label class="field">
          <span>Title</span>
          <input type="text" id="itemTitle" placeholder="e.g. Mom's Birthday" required maxlength="80" />
        </label>

        <div class="field-row">
          <label class="field">
            <span>Date</span>
            <input type="date" id="itemDate" required />
          </label>
          <label class="field" id="timeField">
            <span>Time <small>(optional)</small></span>
            <input type="time" id="itemTime" />
          </label>
        </div>

        <label class="field checkbox-field" id="repeatField" hidden>
          <input type="checkbox" id="itemRepeat" checked />
          <span>Repeats every year</span>
        </label>

        <label class="field">
          <span>Notes <small>(optional)</small></span>
          <textarea id="itemNotes" rows="2" placeholder="Add details, links, or reminders..." maxlength="300"></textarea>
        </label>

        <label class="field">
          <span>Color</span>
          <div class="color-picker" id="colorPicker">
            <button type="button" class="swatch" style="--c:#6366f1" data-color="#6366f1"></button>
            <button type="button" class="swatch" style="--c:#ec4899" data-color="#ec4899"></button>
            <button type="button" class="swatch" style="--c:#f59e0b" data-color="#f59e0b"></button>
            <button type="button" class="swatch" style="--c:#10b981" data-color="#10b981"></button>
            <button type="button" class="swatch" style="--c:#0ea5e9" data-color="#0ea5e9"></button>
            <button type="button" class="swatch" style="--c:#ef4444" data-color="#ef4444"></button>
          </div>
        </label>

        <div class="modal-actions">
          <button type="button" class="btn-danger" id="deleteBtn" hidden>Delete</button>
          <div class="spacer"></div>
          <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
